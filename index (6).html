<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Labo de physique 6e – Révisions</title>
<style>
:root{--n:#1f2a4d;--g:#e0a526;--b:#f6efe0;--w:#fffdf7;--ok:#2f8f5b;--ko:#c0392b;font-family:"Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--n);min-height:100vh;line-height:1.45}
header{background:var(--n);color:var(--b);padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
header h1{margin:0;font:700 1.2rem Georgia,serif;cursor:pointer}
main{max-width:780px;margin:0 auto;padding:1rem}h2,h3{font-family:Georgia,serif;margin:.4rem 0}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--w);border:2px solid var(--n);border-radius:14px;padding:1rem;text-align:left}
.card:hover,.card:focus-visible{border-color:var(--g);box-shadow:0 4px 0 var(--g)}
.card .em{font-size:2rem}.card b{display:block;font:700 1.1rem Georgia,serif}.st{color:var(--g);letter-spacing:2px;font-size:1.2rem}
.btn{background:var(--g);border:2px solid var(--n);border-radius:10px;padding:.6rem 1.2rem;font-weight:700;color:var(--n)}
.btn:hover{background:#f0b83a}.ghost{background:none}
.box{background:var(--w);border:2px solid var(--n);border-radius:14px;padding:1rem;margin:.8rem 0}
.bar{display:flex;justify-content:space-between;font-weight:700;gap:.5rem;flex-wrap:wrap}
.prog{height:8px;background:#e5dcc4;border-radius:5px;overflow:hidden;margin:.4rem 0}.prog i{display:block;height:100%;background:var(--g)}
.q{font-size:1.15rem;font-weight:700;margin:.5rem 0}.qi{display:block;max-height:170px;max-width:100%;margin:.5rem auto;border-radius:8px}
.opt{display:block;width:100%;text-align:left;background:var(--b);border:2px solid var(--n);border-radius:10px;padding:.65rem .9rem;margin:.4rem 0}
.opt:hover:not(:disabled){background:#fbe7b0}.opt:disabled{cursor:default}
.good{background:#d4efdf!important;border-color:var(--ok)!important}.bad{background:#f6d5d1!important;border-color:var(--ko)!important;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.pairs img{display:block;max-height:80px;max-width:100%;margin:0 auto .2rem}
.pl.sel{background:#fbe7b0;border-color:var(--g);box-shadow:0 0 0 3px var(--g)}.pl{text-align:center;font-size:.95rem}
.fb{padding:.7rem;border-radius:10px;margin-top:.7rem;font-weight:700}.fb.good{border:2px solid var(--ok)}.fb.bad{border:2px solid var(--ko);animation:none}.fb span{font-weight:400;display:block}
input[type=text]{font:inherit;font-size:1.2rem;padding:.5rem;border:2px solid var(--n);border-radius:10px;width:9rem;text-align:right}
details{margin:.6rem 0}summary{cursor:pointer;font-weight:700}.rc li{margin:.3rem 0}.big{font-size:3rem;text-align:center}
.mvb{display:inline-block;width:auto;margin:.2rem}.mvb.sel{background:#fbe7b0;border-color:var(--g);box-shadow:0 0 0 3px var(--g)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:.8rem 0}
.mc{aspect-ratio:1;background:var(--n);color:var(--g);font-size:1.6rem;border:2px solid var(--n);border-radius:10px;padding:.2rem;display:flex;align-items:center;justify-content:center;text-align:center}
.mc.up{background:var(--w);color:var(--n);font-size:.78rem;line-height:1.2}.mc.good{background:#d4efdf;border-color:var(--ok)}.mc img{max-width:100%;max-height:100%;object-fit:contain}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

else{m++;b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400)}}}}
function res(ok,e){if(ok){S.streak++;S.ok++;var p=10+Math.min(S.streak-1,5)*2;S.score+=p}else{S.streak=0;S.lives--}
$("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}">${ok?"Bravo ! +"+p+" pts"+(S.streak>2?" 🔥 série de "+S.streak:""):"Pas tout à fait…"}<span>${e||""}</span></div><p><button class="btn" id="nx">${S.i+1>=S.qs.length||S.lives<=0?"Voir mon résultat":"Question suivante"}</button></p>`;$("#nx").onclick=()=>{S.i++;ask()};$("#nx").focus()}
function end(){const n=S.qs.length,r=S.ok/n,s=S.lives<=0?0:r>=.9?3:r>=.7?2:1,d=st.get(),o=d[S.k]||{};d[S.k]={s:Math.max(o.s||0,s),b:Math.max(o.b||0,S.score)};st.set(d);
const t=S.lives<=0?["💥","Plus de fioles !","Relis « Je retiens » et retente ta chance."]:s==3?["🏆","Savant(e) du Labo !","Quasi sans faute, bravo !"]:s==2?["🔬","Chercheur(se) confirmé(e)","Encore un petit effort pour les 3 étoiles."]:["🧪","Apprenti(e) chimiste","Continue, tu progresses !"];
app.innerHTML=`<div class="box"><div class="big">${t[0]}</div><h2 style="text-align:center">${t[1]}</h2><p style="text-align:center">${t[2]}</p><p style="text-align:center" class="st">${"★".repeat(s)+"☆".repeat(3-s)}</p><p style="text-align:center">${S.ok} bonne(s) réponse(s) sur ${S.qs.length} · ${S.score} points (record : ${d[S.k].b})</p><p style="text-align:center"><button class="btn" id="re">Rejouer</button> <button class="btn ghost" id="mn">Menu</button></p></div>`;$("#re").onclick=()=>play(S.k);$("#mn").onclick=home}
function comp(q,z){let m=null;z.innerHTML=`<p>Mouvement :</p><div>${M.map(x=>`<button class="opt mvb">${x}</button>`).join("")}</div><p>Vitesse : <input type="text" id="in" inputmode="decimal" autocomplete="off" aria-label="Vitesse"> ${q.u} <button class="btn" id="vl">Valider</button></p>`;
z.querySelectorAll(".mvb").forEach(b=>b.onclick=()=>{z.querySelectorAll(".mvb").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");m=b.textContent});
const f=()=>{const x=parseFloat($("#in").value.replace(",",".").replace(/[^0-9.\-]/g,""));if(isNaN(x)||!m){$("#fb").innerHTML=`<p>Choisis un mouvement et écris la vitesse.</p>`;return}$("#fb").innerHTML="";z.querySelectorAll("button,input").forEach(x=>x.disabled=true);res(m==q.mov&&Math.abs(x-q.a)<1e-9,q.e)};
$("#vl").onclick=f;$("#in").onkeydown=e=>{if(e.key=="Enter")f()}}
/* ---------- Jeu : Memory ---------- */
const MT={app:["Les appareils de mesure",()=>D.map(d=>[d.i,d.n])],traj:["Les trajectoires",()=>T.map(x=>[x[0],x[1]])],vit:["Les vitesses",()=>V.map(v=>[v[0],v[2]])]};
function memMenu(){app.innerHTML=`<h2>🃏 Memory du Labo</h2><p>Retourne deux cartes à la fois et retrouve les 6 paires image / mot avec le moins de coups possible.</p><div class="grid">`+Object.keys(MT).map(k=>`<button class="card" data-m="${k}"><b>${MT[k][0]}</b><span class="st">${stars("mem_"+k)}</span></button>`).join("")+`</div><p><button class="btn ghost" id="bk">Retour</button></p>`;
app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>memPlay(b.dataset.m));$("#bk").onclick=home}
function memPlay(k){const pr=sh(MT[k][1]()).slice(0,6),cs=sh(pr.flatMap((p,i)=>[{i,h:im(p[0])},{i,h:p[1]}]));let open=[],mv=0,ok=0,lock=false;
app.innerHTML=`<h2>🃏 ${MT[k][0]}</h2><div class="bar"><span id="cp">Coups : 0</span><span>6 paires à retrouver</span></div><div class="mem">`+cs.map((c,j)=>`<button class="mc" data-j="${j}" aria-label="Carte ${j+1}">?</button>`).join("")+`</div><button class="btn ghost" id="bk">Abandonner</button>`;
$("#bk").onclick=memMenu;const bs=app.querySelectorAll(".mc");
bs.forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(lock||open.includes(j)||b.classList.contains("good"))return;b.innerHTML=cs[j].h;b.classList.add("up");open.push(j);
if(open.length==2){mv++;$("#cp").textContent="Coups : "+mv;const[a,c]=open;
if(cs[a].i==cs[c].i){[a,c].forEach(x=>bs[x].classList.add("good"));open=[];if(++ok==6)setTimeout(()=>memEnd(k,mv),700)}
else{lock=true;setTimeout(()=>{[a,c].forEach(x=>{bs[x].innerHTML="?";bs[x].classList.remove("up")});open=[];lock=false},1000)}}})}
function memEnd(k,mv){const s=mv<=9?3:mv<=14?2:1,d=st.get(),o=d["mem_"+k]||{};d["mem_"+k]={s:Math.max(o.s||0,s),b:Math.min(o.b||99,mv)};st.set(d);
app.innerHTML=`<div class="box"><div class="big">🃏</div><h2 style="text-align:center">Toutes les paires trouvées !</h2><p style="text-align:center" class="st">${"★".repeat(s)+"☆".repeat(3-s)}</p><p style="text-align:center">${mv} coups (record : ${d["mem_"+k].b})</p><p style="text-align:center"><button class="btn" id="re">Rejouer</button> <button class="btn ghost" id="mn">Autres thèmes</button></p></div>`;$("#re").onclick=()=>memPlay(k);$("#mn").onclick=memMenu}
$("#home").onclick=home;home();
</script></body></html>
